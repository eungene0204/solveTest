paperCrop: [0.513, 0.552, 0.902, 0.602]   # 원문 대조용 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    함수 $f(x)=4x^3-2x$ 의 한 부정적분 $F(x)$ 에 대하여 $F(0)=4$ 일 때, $F(2)$ 의 값을 구하시오. [3점]
format: short
answer:
  value: "16"
status: published
difficulty: basic
concepts:
  - { label: 부정적분, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  $F(x)$ 를 구하면 적분상수 하나가 남는다. $F(0)=4$ 가 그 상수를 정해 준다.
firstIdea: |
  $F(x)=\displaystyle\int(4x^3-2x)\,dx$ 는 적분상수까지 포함해 정해진다. $F(0)$ 은 바로 그 적분상수이므로 $F(0)=4$ 에서 상수가 결정된다.
steps:
  - title: 부정적분을 구한다
    body: |
      $F(x)=x^4-x^2+C$
    why: |
      $4x^3\to x^4$, $2x\to x^2$ 이다.
  - title: 적분상수를 정하고 대입한다
    body: |
      $F(0)=C=4$ 이므로 $F(2)=16-4+4=16$.
    why: |
      $x=0$ 을 넣으면 다항식 부분이 모두 0이 되어 적분상수만 남는다.
pitfalls:
  - |
    적분상수를 빠뜨려 $F(2)=12$ 로 답하는 실수.
