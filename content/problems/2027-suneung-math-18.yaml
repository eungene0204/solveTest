problem:
  body: |
    $\displaystyle\sum_{k=1}^{5}(2k+a)=\sum_{k=1}^{5}k^2$ 일 때, 상수 $a$ 의 값을 구하시오. [3점]
format: short
answer:
  value: "5"
status: published
difficulty: basic
concepts:
  - { label: 합의 기호 Σ, course2015: 수학Ⅰ, course2022: 대수 }
  - { label: 자연수의 거듭제곱의 합, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  $\Sigma$ 를 항별로 나눠 보자. 상수 $a$ 를 $k=1$ 부터 $5$ 까지 더하면 얼마가 될까?
firstIdea: |
  $\Sigma$ 의 성질로 $\displaystyle\sum(2k+a)=2\sum k+\sum a$ 로 나누면 좌변은 $a$ 에 대한 일차식이 된다. 우변은 $\sum k^2$ 공식으로 숫자 하나가 된다.
steps:
  - title: 좌변을 계산한다
    body: |
      $$
      \begin{aligned}
      \sum_{k=1}^{5}(2k+a)&=2\times15+5a\\
      &=30+5a
      \end{aligned}
      $$
    why: |
      $\displaystyle\sum_{k=1}^{5}k=15$ 이고, 상수 $a$ 는 다섯 번 더해지므로 $5a$ 다.
  - title: 우변을 계산하고 비교한다
    body: |
      $\displaystyle\sum_{k=1}^{5}k^2=\frac{5\times6\times11}{6}=55$ 이므로 $30+5a=55$, $a=5$.
    why: |
      $\displaystyle\sum_{k=1}^{n}k^2=\frac{n(n+1)(2n+1)}{6}$ 이다. $1+4+9+16+25$ 를 직접 더해도 된다.
pitfalls:
  - |
    $\displaystyle\sum_{k=1}^{5}a$ 를 $a$ 로 쓰는 실수. 그러면 $a=25$ 가 나온다.
