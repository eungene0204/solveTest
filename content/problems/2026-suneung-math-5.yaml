problem:
  body: |
    함수 $f(x)=(x+2)(2x^2-x-2)$ 에 대하여 $f'(1)$ 의 값은? [3점]
  choices: ["6", "7", "8", "9", "10"]
format: choice
answer:
  value: "8"
  choice: 3
status: published
difficulty: basic
concepts:
  - { label: 곱의 미분법, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  전개해서 미분해도 되지만, 두 식의 곱을 그대로 미분하는 방법도 있다.
firstIdea: |
  두 다항식의 곱이므로 곱의 미분법 $\{u v\}'=u'v+uv'$ 을 쓰면 전개 없이 $x=1$ 을 바로 넣을 수 있다.
steps:
  - title: 곱의 미분법을 쓴다
    body: |
      $$
      \begin{aligned}
      f'(x)&=(2x^2-x-2)\\
      &\quad+(x+2)(4x-1)
      \end{aligned}
      $$
    why: |
      $(x+2)'=1$, $(2x^2-x-2)'=4x-1$ 이다.
  - title: $x=1$ 을 대입한다
    body: |
      $f'(1)=(2-1-2)+3\times3=-1+9=8$
    why: |
      곱의 미분법으로 두면 각 인수에 1을 넣기만 하면 되어 계산이 짧다.
pitfalls:
  - |
    곱의 미분을 $(x+2)'\times(2x^2-x-2)'=4x-1$ 처럼 각자 미분해서 곱하는 실수. 그러면 $3$ 이 나온다.
  - |
    $2x^2-x-2$ 에 $x=1$ 을 넣은 값 $-1$ 의 부호를 놓치는 실수.
