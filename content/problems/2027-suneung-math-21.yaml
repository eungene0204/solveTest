problem:
  body: |
    최고차항의 계수가 1인 삼차함수 $f(x)$ 가 있다. 실수 $t$ 에 대하여 구간 $(-\infty,\,t]$ 에서 $f(x)$ 의 최댓값과 구간 $[t,\,\infty)$ 에서 $f(x)$ 의 최솟값의 곱을 $g(t)$ 라 할 때, 다음 조건이 성립한다.
  conditions:
    - |
      (가) 어떤 양수 $a$ 에 대하여

      $$
      \begin{aligned}
      &\lim_{t\to a-}\frac{g(t)-g(a)}{t-a}\\
      &\quad-\lim_{t\to a+}\frac{g(t)-g(a)}{t-a}=36
      \end{aligned}
      $$

      이다.
    - |
      (나) $g'(b)=0$ 인 실수 $b$ 의 최댓값은 $2$ 이고, 최솟값은 $-1$ 이다.
  after: |
    $f(5)$ 의 값을 구하시오. [4점]
format: short
answer:
  value: "135"
status: published
difficulty: hard
concepts:
  - { label: 삼차함수의 그래프, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 구간에서의 최댓값·최솟값, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 미분가능성, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  삼차함수의 극대점을 $\alpha$, 극소점을 $\beta$ 라 하자. $t$ 를 왼쪽에서 오른쪽으로 움직일 때, "왼쪽 구간의 최댓값"과 "오른쪽 구간의 최솟값"이 각각 언제 $f(t)$ 이고 언제 상수가 되는지 나눠 보자.
firstIdea: |
  $g(t)$ 는 구간마다 $f(t)^2$, $m\,f(t)$, $Mm$, $M f(t)$ 중 하나로 바뀐다($M$ 은 극댓값, $m$ 은 극솟값). 조건 (가)는 $g$ 가 꺾이는 점에서의 기울기 차이이고, 조건 (나)는 $g'(t)=0$ 인 점들의 범위다. 그래서 먼저 $g$ 를 구간별 식으로 쓴다.
steps:
  - title: $g(t)$ 를 구간별로 쓴다
    body: |
      $f$ 의 극대점을 $\alpha$, 극소점을 $\beta$, $M=f(\alpha)$, $m=f(\beta)$ 라 하자. $\delta<\alpha$ 는 $f(\delta)=m$, $\gamma>\beta$ 는 $f(\gamma)=M$ 인 점이다.
      $$
      g(t)=\begin{cases} f(t)^2 & t\le\delta\\ m\,f(t) & \delta\le t\le\alpha\\ Mm & \alpha\le t\le\beta\\ M\,f(t) & \beta\le t\le\gamma\\ f(t)^2 & t\ge\gamma\end{cases}
      $$
    why: |
      왼쪽 구간의 최댓값은 $t\le\alpha$ 에서 $f(t)$, $t$ 가 $\alpha$ 와 $\gamma$ 사이면 극댓값 $M$, $t\ge\gamma$ 면 다시 $f(t)$ 다. 오른쪽 구간의 최솟값도 같은 방식으로 $\delta,\beta$ 에서 바뀐다.
  - title: 조건 (가)를 꺾이는 점에서 읽는다
    body: |
      $\alpha,\beta$ 에서는 양쪽 기울기가 모두 0이라 매끄럽다. 꺾이는 곳은 $\delta$ 와 $\gamma$ 뿐이다.
      좌미분계수에서 우미분계수를 빼면

      $t=\delta$ 에서
      $$
      2m f'(\delta)-m f'(\delta)=m f'(\delta)
      $$
      $t=\gamma$ 에서
      $$
      M f'(\gamma)-2M f'(\gamma)=-M f'(\gamma)
      $$
      $f'(\delta)>0,\ f'(\gamma)>0$ 이므로 값이 $36>0$ 이 되려면 $m>0$ 이거나 $M<0$ 이어야 한다.
    why: |
      $f^2$ 의 도함수는 $2ff'$ 이고, 꺾이는 점에서는 $f=m$ 또는 $f=M$ 이다. 부호를 따지면 가능한 경우가 둘로 좁혀진다.
  - title: 조건 (나)로 경우를 가른다
    body: |
      $g'(t)=0$ 인 점은 구간 $[\alpha,\beta]$ 전체와, $t<\delta$ 또는 $t>\gamma$ 에서의 $f$ 의 근이다.

      - $m>0$ 이면 $\delta$ 보다 왼쪽에 근이 있어 최솟값 $-1$ 은 그 근, 최댓값 $2$ 는 $\beta$. 이 경우 $f(-1)=0,\ f'(2)=0$ 에서 $(\delta+1)(\delta-2)^2=4$ 가 되어 $\delta=0$ 또는 $3$ 인데, $a=\delta>0$ 이고 $\delta<\beta=2$ 를 만족하는 해가 없다.
      - $M<0$ 이면 $\gamma$ 보다 오른쪽에 근이 있어 최댓값 $2$ 는 그 근, 최솟값 $-1$ 은 $\alpha$. 즉 $f'(-1)=0,\ f(2)=0$.
    why: |
      $g'=0$ 인 점의 최솟값과 최댓값이 각각 어떤 점인지 정해지면, $f$ 에 대한 조건 두 개가 나온다.
  - title: $M<0$ 인 경우를 계산한다
    body: |
      $f(x)-M=(x+1)^2(x-\gamma)$ 이므로 $f(x)=(x+1)^2(x-\gamma)+M$, $f'(\gamma)=(\gamma+1)^2$.

      $f(2)=0$ 에서 $M=-9(2-\gamma)$. 조건 (가) $-M f'(\gamma)=36$ 에 넣으면
      $$
      \begin{aligned}
      9(2-\gamma)(\gamma+1)^2&=36\\
      \gamma^3-3\gamma+2&=0\\
      (\gamma-1)^2(\gamma+2)&=0
      \end{aligned}
      $$
      $\gamma>0$ 이므로 $\gamma=1$, $M=-9$. 이때 $\beta=\frac13<\gamma$ 이고 $a=1>0$ 으로 조건에 맞는다.
      $$
      f(x)=(x+1)^2(x-1)-9
      $$
      $$
      f(5)=36\cdot4-9=135
      $$
    why: |
      극대점 $\alpha=-1$ 에서 $y=M$ 과 접하므로 $f(x)-M$ 은 $(x+1)^2$ 을 인수로 갖는다. 이렇게 두면 미지수가 $\gamma$ 와 $M$ 둘뿐이다.
pitfalls:
  - |
    $\alpha$ 와 $\beta$ 에서도 $g$ 가 꺾인다고 생각하기 쉽다. 두 점에서는 $f'=0$ 이라 양쪽 기울기가 모두 0이다.
  - |
    $[\alpha,\beta]$ 에서 $g$ 가 상수이므로 $g'=0$ 인 점이 구간 전체라는 것을 놓치면 조건 (나)를 읽을 수 없다.
  - |
    $m>0$ 인 경우를 확인하지 않고 넘어가면 답이 하나인지 보장되지 않는다. 그 경우에는 조건을 만족하는 해가 없음을 확인해야 한다.
