paperCrop: [0.513, 0.524, 0.902, 0.600]   # 원문 대조용 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    다항함수 $f(x)$ 에 대하여

    $$
    f'(x)=6x^2+1,\quad f(1)=5
    $$

    가 성립할 때, $f(2)$ 의 값을 구하시오. [3점]
format: short
answer:
  value: "20"
status: published
difficulty: basic
concepts:
  - { label: 부정적분, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  도함수가 주어졌으니 부정적분으로 $f(x)$ 를 구할 수 있다. 남는 적분상수는 어떤 조건으로 정할까?
firstIdea: |
  $f(x)=\displaystyle\int f'(x)\,dx$ 이고, 적분상수 하나가 남는다. $f(1)=5$ 가 그 상수를 정해 준다.
steps:
  - title: 부정적분을 구한다
    body: |
      $f(x)=\displaystyle\int(6x^2+1)\,dx=2x^3+x+C$
    why: |
      $x^n$ 의 부정적분은 $\dfrac{x^{n+1}}{n+1}$ 이다. 도함수만으로는 상수항을 알 수 없어 $C$ 가 붙는다.
  - title: 적분상수를 정하고 대입한다
    body: |
      $f(1)=2+1+C=5$ 에서 $C=2$. 따라서 $f(2)=16+2+2=20$.
    why: |
      함숫값 하나가 주어지면 적분상수가 하나로 정해진다. $f(2)=f(1)+\displaystyle\int_1^2 f'(x)\,dx=5+15$ 로 계산해도 같다.
pitfalls:
  - |
    적분상수 $C$ 를 빠뜨려 $f(2)=18$ 로 답하는 실수.
  - |
    $6x^2$ 의 부정적분을 $3x^3$ 처럼 지수에 맞춰 나누지 않는 실수. $6\times\dfrac{x^3}{3}=2x^3$ 이다.
