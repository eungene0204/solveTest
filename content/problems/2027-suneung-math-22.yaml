number: 22
paperType: odd
paperPage: 8
paperCrop: [0.513, 0.131, 0.902, 0.345]   # 문항 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    모든 항이 양수인 수열 $\{a_n\}$ 이 있다. 모든 자연수 $n$ 에 대하여

    $$
    a_n=a_{n+6}=a_{n+9}
    $$

    이고, 다음 조건이 성립한다.
  conditions:
    - |
      (가) $3a_5+2a_6+3a_{10}=11$
    - |
      (나) $\displaystyle\sum_{k=1}^{20}a_k=26$, $\displaystyle\sum_{k=1}^{35}\log_2 a_k=-10$
  after: |
    $\displaystyle\sum_{k=1}^{40}\frac{1}{a_ka_{k+1}}$ 의 값을 구하시오. [4점]
format: short
answer:
  value: "98"
status: draft
difficulty: hard
concepts:
  - { label: 주기를 갖는 수열, course2015: 수학Ⅰ, course2022: 대수 }
  - { label: 로그의 성질, course2015: 수학Ⅰ, course2022: 대수 }
  - { label: 합의 기호 Σ, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  $a_n=a_{n+6}$ 과 $a_n=a_{n+9}$ 가 동시에 성립하면, 실제로 몇 칸마다 같은 값이 반복될까? 반복되는 몇 개의 값만 미지수로 두고 조건을 다시 써 보자.
firstIdea: |
  6칸 뒤와 9칸 뒤가 모두 같다면 $a_{n+3}=a_{n+9-6}$ 처럼 3칸 뒤도 같아진다. 그래서 수열은 세 값 $p, q, r$ 만 반복되고, 조건 (가)·(나)와 구하는 합이 모두 $p, q, r$ 의 식이 된다.
steps:
  - title: 수열은 주기 3이다
    body: |
      $a_{n+3}=a_{(n+3)+6}=a_{n+9}=a_n$ 이므로 $a_1=p,\ a_2=q,\ a_3=r$ 라 하면
      $$
      a_{3k+1}=p,\quad a_{3k+2}=q,\quad a_{3k}=r .
      $$
    why: |
      $n+3$ 에 $a_n=a_{n+6}$ 을 적용하면 $a_{n+3}=a_{n+9}$ 이고, 이것이 다시 $a_n$ 과 같다. 6과 9의 최대공약수 3이 실제 주기가 된다.
  - title: 조건 (가)와 첫 번째 합에서 $r$ 과 $p+q+r$ 을 구한다
    body: |
      $a_5=q,\ a_6=r,\ a_{10}=p$ 이므로 (가)는 $3p+3q+2r=11$.

      $1$ 부터 $20$ 까지는 6번의 완전한 주기(18개)와 $a_{19}=p,\ a_{20}=q$ 이므로
      $$
      6(p+q+r)+p+q=26 .
      $$
      $S=p+q+r$ 로 두면 두 식은 $3S-r=11,\ 7S-r=26$ 이고, 빼면 $4S=15$. 따라서
      $S=\dfrac{15}{4}$, $r=3S-11=\dfrac14$, $p+q=\dfrac72$.
    why: |
      두 식 모두 $p$ 와 $q$ 의 계수가 같으므로 $p+q$ 를 한 덩어리로 보면 미지수가 둘로 줄어든다.
  - title: 로그 조건에서 $pq$ 를 구한다
    body: |
      $1$ 부터 $35$ 까지는 11번의 주기(33개)와 $a_{34}=p,\ a_{35}=q$ 이므로
      $$
      \begin{aligned}
      &11\log_2(pqr)+\log_2(pq)\\
      &=\log_2\left\{(pq)^{12}r^{11}\right\}=-10
      \end{aligned}
      $$
      $r=\dfrac14=2^{-2}$ 을 넣으면 $(pq)^{12}\cdot 2^{-22}=2^{-10}$, 즉 $(pq)^{12}=2^{12}$ 이고 $pq>0$ 이므로 $pq=2$.
    why: |
      로그의 합은 곱의 로그다. $r$ 이 2의 거듭제곱이라 지수끼리 비교하면 바로 정리된다.
  - title: 구하는 합은 $p, q$ 를 따로 몰라도 계산된다
    body: |
      이웃한 두 항의 곱은 $pq,\ qr,\ rp$ 가 반복된다. $1$ 부터 $40$ 까지는 13번의 주기(39개)와 $k=40$ 의 $\dfrac{1}{a_{40}a_{41}}=\dfrac{1}{pq}$ 이다.
      $$
      \begin{aligned}
      \frac{1}{pq}+\frac{1}{qr}+\frac{1}{rp}&=\frac{p+q+r}{pqr}\\
      &=\frac{15/4}{2\cdot\frac14}=\frac{15}{2}
      \end{aligned}
      $$
      $$
      \sum_{k=1}^{40}\frac{1}{a_ka_{k+1}}=13\cdot\frac{15}{2}+\frac12=98 .
      $$
    why: |
      세 분수를 통분하면 분자가 $p+q+r$, 분모가 $pqr$ 이 되어, 이미 구한 $S$ 와 $pq$, $r$ 만으로 끝난다.
pitfalls:
  - |
    주기를 6이나 9로 두고 풀면 미지수가 너무 많아 조건이 부족해 보인다. 두 조건을 함께 쓰면 주기는 3이다.
  - |
    $a_5, a_6, a_{10}$ 이 각각 $q, r, p$ 에 대응한다. 특히 $a_{10}=a_1$ 을 $a_3$ 으로 착각하기 쉽다.
  - |
    $1$ 부터 $20$, $35$, $40$ 까지 셀 때 남는 항이 $p, q$ 두 개($k=40$ 에서는 $\frac{1}{pq}$ 하나)라는 점을 놓치기 쉽다.
  - |
    $p+q=\frac72,\ pq=2$ 에서 $p, q$ 를 직접 구하면 무리수가 나온다. 구할 필요가 없다.
