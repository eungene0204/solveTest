problem:
  body: |
    상수 $a\,(a>1)$ 에 대하여 두 함수

    $$
    \begin{aligned}
    f(x)&=\log_a(x-4)+1,\\
    g(x)&=\log_a(x+2)+2
    \end{aligned}
    $$

    가 있다. 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(5,\,1)$ 을 지나고 기울기가 $-\dfrac{1}{6}$ 인 직선이 곡선 $y=g(x)$ 와 만나는 점을 Q라 하고, 점 P를 지나는 직선 $y=-2x+11$ 이 곡선 $y=g(x)$ 와 만나는 점을 R이라 하자. 삼각형 PQR의 무게중심이 직선 $y=2x$ 위에 있을 때, $a^6$ 의 값은? [4점]
  figure: 2027-suneung-math-14
  choices: ['$\dfrac{11}{4}$', "3", '$\dfrac{13}{4}$', '$\dfrac{7}{2}$', '$\dfrac{15}{4}$']
format: choice
answer:
  value: "\\frac{7}{2}"
  choice: 4
status: draft
difficulty: standard
concepts:
  - { label: 로그함수 그래프의 평행이동, course2015: 수학Ⅰ, course2022: 대수 }
  - { label: 삼각형의 무게중심, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  두 함수의 식을 비교해 보자. $y=g(x)$ 의 그래프는 $y=f(x)$ 의 그래프를 어느 방향으로 얼마만큼 옮긴 것일까? 그 이동을 기울기로 나타내면 어떤 값이 될까?
firstIdea: |
  $g(x)=f(x+6)+1$ 이므로 $y=g(x)$ 는 $y=f(x)$ 를 $x$ 축 방향으로 $-6$, $y$ 축 방향으로 $1$ 만큼 옮긴 그래프다. 이 이동의 기울기가 $\frac{1}{-6}=-\frac16$ 이라서, P를 지나는 기울기 $-\frac16$ 의 직선은 P를 옮긴 점에서 $y=g(x)$ 를 만난다. 그래서 Q를 계산 없이 얻을 수 있다.
steps:
  - title: 평행이동으로 Q를 구한다
    body: |
      $$
      \begin{aligned}
      f(x+6)+1&=\log_a(x+2)+1+1\\
      &=g(x)
      \end{aligned}
      $$
      이므로 P$(5,1)$ 을 $(-6,+1)$ 만큼 옮긴 점 $(-1,2)$ 는 $y=g(x)$ 위에 있다. 실제로 $g(-1)=\log_a1+2=2$.
      두 점을 잇는 직선의 기울기는 $\dfrac{2-1}{-1-5}=-\dfrac16$ 이므로 Q$(-1,2)$.
    why: |
      문제의 기울기 $-\frac16$ 이 평행이동 벡터 $(-6,1)$ 의 기울기와 같다는 것이 이 문제의 설계 의도다. 로그방정식을 풀지 않고 Q를 찾게 해 준다.
  - title: 무게중심 조건으로 R를 구한다
    body: |
      R는 직선 $y=-2x+11$ 위에 있으므로 R$(r,\,11-2r)$ 로 둔다. 무게중심은
      $$
      \left(\frac{4+r}{3},\ \frac{14-2r}{3}\right)
      $$
      이것이 $y=2x$ 위에 있으므로 $14-2r=2(4+r)$, $r=\dfrac32$. 따라서 R$\left(\dfrac32,\,8\right)$.
    why: |
      R의 좌표를 미지수 하나로 두면 무게중심 조건이 일차방정식이 된다. 로그는 마지막에 한 번만 쓴다.
  - title: R가 $y=g(x)$ 위에 있다는 조건으로 $a^6$ 을 구한다
    body: |
      $$
      g\!\left(\tfrac32\right)=\log_a\tfrac72+2=8
      $$
      이므로 $\log_a\frac72=6$, 즉 $a^6=\dfrac72$.
    why: |
      문제가 $a$ 가 아니라 $a^6$ 을 묻는 이유가 여기서 드러난다. 로그의 정의를 그대로 쓰면 된다.
pitfalls:
  - |
    Q를 구하려고 $\log_a(x+2)+2=-\frac16(x-5)+1$ 을 직접 풀려고 하면 막힌다. 두 그래프의 평행이동 관계를 먼저 본다.
  - |
    무게중심의 $y$ 좌표를 계산할 때 R의 $y$ 좌표 $11-2r$ 을 빠뜨리거나 부호를 틀리기 쉽다.
