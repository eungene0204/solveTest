problem:
  body: |
    수열 $\{a_n\}$ 에 대하여 $\displaystyle\sum_{k=1}^{4}(2a_k-k)=0$ 일 때, $\displaystyle\sum_{k=1}^{4}a_k$ 의 값은? [3점]
  choices: ["1", "2", "3", "4", "5"]
format: choice
answer:
  value: "5"
  choice: 5
status: published
difficulty: basic
concepts:
  - { label: 합의 기호 Σ의 성질, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  $\Sigma$ 를 항별로 나눠 보자. $\displaystyle\sum_{k=1}^{4}k$ 는 숫자 하나다.
firstIdea: |
  $\Sigma$ 는 항별로 나눌 수 있고 상수배를 밖으로 뺄 수 있다. $\displaystyle\sum(2a_k-k)=2\sum a_k-\sum k$ 로 나누면 구하는 값 $\sum a_k$ 에 대한 일차방정식이 된다.
steps:
  - title: 항별로 나눈다
    body: |
      $$
      \begin{aligned}
      &\sum_{k=1}^{4}(2a_k-k)\\
      &=2\sum_{k=1}^{4}a_k-\sum_{k=1}^{4}k=2\sum_{k=1}^{4}a_k-10
      \end{aligned}
      $$
    why: |
      $\displaystyle\sum_{k=1}^{4}k=1+2+3+4=10$ 이다.
  - title: 방정식을 푼다
    body: |
      $2\displaystyle\sum_{k=1}^{4}a_k-10=0$ 이므로 $\displaystyle\sum_{k=1}^{4}a_k=5$.
    why: |
      각 $a_k$ 를 몰라도 합 전체를 하나의 미지수처럼 다루면 된다.
pitfalls:
  - |
    $\displaystyle\sum_{k=1}^{4}k$ 를 $4$ 로 쓰는 실수. $k$ 는 1부터 4까지 바뀌므로 합은 10이다.
