paperCrop: [0.513, 0.128, 0.902, 0.248]   # 원문 대조용 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    수열 $\{a_n\}$ 은 $a_1=1$ 이고, 모든 자연수 $n$ 에 대하여

    $$
    a_{n+1}=n^2a_n+1
    $$

    을 만족시킨다. $a_3$ 의 값을 구하시오. [3점]
format: short
answer:
  value: "9"
status: published
difficulty: basic
concepts:
  - { label: 수열의 귀납적 정의, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  $n=1$ 을 넣으면 $a_2$, $n=2$ 를 넣으면 $a_3$ 이 나온다.
firstIdea: |
  귀납적으로 정의된 수열은 앞의 항에서 다음 항이 차례로 정해진다. 몇 번째 항까지만 필요하면 $n=1,2,\dots$ 를 순서대로 대입하는 것이 가장 확실하다.
steps:
  - title: $a_2$
    body: |
      $n=1$: $a_2=1^2\times a_1+1=2$.
    why: |
      식의 $n$ 에 1을 넣으면 $a_{n+1}=a_2$ 다.
  - title: $a_3$
    body: |
      $n=2$: $a_3=2^2\times a_2+1=4\times2+1=9$.
    why: |
      곱해지는 $n^2$ 은 구하는 항의 번호가 아니라 앞 항의 번호 $n$ 의 제곱이다.
pitfalls:
  - |
    $a_3$ 을 구할 때 $n=3$ 을 넣어 $3^2a_2+1$ 로 계산하는 실수. $a_{n+1}=a_3$ 이 되려면 $n=2$ 다.
