paperCrop: [0.099, 0.128, 0.492, 0.508]   # 원문 대조용 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    최고차항의 계수가 양수인 삼차함수 $f(x)$ 와 실수 $t$ 에 대하여 함수

    $$
    g(x)=\begin{cases}-f(x) & (x<t)\\ f(x) & (x\ge t)\end{cases}
    $$

    는 실수 전체의 집합에서 연속이고 다음 조건을 만족시킨다.
  conditions:
    - |
      (가) 모든 실수 $a$ 에 대하여 $\displaystyle\lim_{x\to a+}\frac{g(x)}{x(x-2)}$ 의 값이 존재한다.
    - |
      (나) $\displaystyle\lim_{x\to m+}\frac{g(x)}{x(x-2)}$ 의 값이 음수가 되도록 하는 자연수 $m$ 의 집합은 $\left\{g(-1),\,-\dfrac{7}{2}g(1)\right\}$ 이다.
  after: |
    $g(-5)$ 의 값을 구하시오. (단, $g(-1)\neq-\dfrac{7}{2}g(1)$) [4점]
format: short
answer:
  value: "65"
status: published
difficulty: hard
concepts:
  - { label: 함수의 연속, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 함수의 극한, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 삼차함수의 그래프, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  분모 $x(x-2)$ 가 0이 되는 $x=0, 2$ 에서 극한이 존재하려면 분자는 어떻게 되어야 할까? 그리고 (나)의 집합의 원소가 자연수라는 사실은 $g(1)$ 의 부호에 대해 무엇을 알려 줄까?
firstIdea: |
  연속 조건과 (가)에서 $f$ 의 세 근이 정해진다: $g$ 가 $x=t$ 에서 연속이려면 $f(t)=0$, 분모가 0이 되는 $x=0,2$ 에서 극한이 존재하려면 $f(0)=f(2)=0$. 그래서 $f(x)=c\,x(x-2)(x-r)$ 로 두고, (나)에서 **$m$ 이 어떤 값일 때 극한이 음수인지**를 $t$ 의 위치별로 따진다.
steps:
  - title: $f$ 의 꼴을 정한다
    body: |
      $g$ 가 $x=t$ 에서 연속이므로 $-f(t)=f(t)$, 즉 $f(t)=0$.
      (가)에서 $a=0,\,2$ 일 때 분모가 0으로 가므로 분자도 0으로 가야 하고, $g(0)=g(2)=0$ 즉 $f(0)=f(2)=0$.
      따라서 $f(x)=c\,x(x-2)(x-r)\ (c>0)$ 이고 $t\in\{0,\,2,\,r\}$.
    why: |
      분모가 0으로 가는데 극한이 존재하려면 분자도 0으로 가야 한다. $f$ 는 다항식이라 $x=0$, $x=2$ 근처에서 $\dfrac{f(x)}{x}$, $\dfrac{f(x)}{x-2}$ 의 극한도 존재한다.
  - title: (나)의 극한의 부호를 정리한다
    body: |
      $L(m)=\displaystyle\lim_{x\to m+}\frac{g(x)}{x(x-2)}$ 라 하자.
      - $m=1$: 분모가 $-1$ 이므로 $L(1)=-g(1)$.
      - $m=2$: $L(2)=\dfrac{1}{2}\times$($g$ 의 $x=2$ 에서의 우미분계수).
      - $m\ge3$: 분모가 양수이므로 $L(m)$ 의 부호는 $g(m)$ 의 부호.

      (나)의 원소 $-\dfrac{7}{2}g(1)$ 이 자연수이므로 $g(1)<0$, 따라서 $L(1)>0$ 이고 $1$ 은 집합에 없다. 또 $g(-1)>0$.
    why: |
      $g(2)=0$ 이라 $x=2$ 에서의 극한은 우미분계수를 분모의 $x$ 값 2로 나눈 것이 된다.
  - title: $t$ 의 위치로 경우를 나눈다
    body: |
      - $t\le1$ 이면 $g(1)=f(1)=c(r-1)<0$ 에서 $r<1$. 그러면 $x>2$ 에서 $f>0$, $f'(2)=2c(2-r)>0$ 이라 집합이 비어 있다.
      - $1<t<2$ (즉 $t=r$, $1<r<2$)이면 $x\ge2$ 에서 $g=f$ 이고 같은 이유로 집합이 비어 있다.
      - $t=r>2$ 이면 $2\le m<r$ 에서 $g=-f$ 라 $L(2)>0$, $g(m)>0$ 이고, $m\ge r$ 에서는 $g=f\ge0$ 이라 집합이 비어 있다.
      - $t=2$ 이면 $g(1)=-f(1)=c(1-r)<0$ 에서 $r>1$. $r\le2$ 이면 집합이 비고, $r>2$ 이면 $L(2)=f'(2)/2<0$ 이고 $3\le m<r$ 에서 $f(m)<0$ 이므로 집합은 $\{2,\,3,\,\dots\}$ 중 $r$ 보다 작은 자연수들이다.

      원소가 2개이므로 $t=2$, $3<r\le4$ 이고 집합은 $\{2,\,3\}$.
    why: |
      집합이 비지 않으려면 $x=2$ 바로 오른쪽이나 그 너머에서 $g$ 가 음수인 곳이 있어야 하고, 그런 경우는 $t=2$, $r>2$ 뿐이다.
  - title: 값을 맞춰 $c,\ r$ 을 구한다
    body: |
      $t=2$ 이므로 $g(-1)=-f(-1)=3c(r+1)$, $-\dfrac{7}{2}g(1)=\dfrac{7}{2}c(r-1)$.
      $3<r\le4$ 에서 $3(r+1)>\dfrac{7}{2}(r-1)$ 이므로 $g(-1)=3$, $-\dfrac{7}{2}g(1)=2$:
      $$
      c(r+1)=1,\qquad c(r-1)=\frac{4}{7}
      $$
      빼면 $2c=\dfrac{3}{7}$, $c=\dfrac{3}{14}$, $r=\dfrac{11}{3}$ (범위에 맞음).
    why: |
      두 식 모두 $c$ 가 곱해져 있으므로 빼거나 나누면 미지수가 하나씩 정리된다.
  - title: $g(-5)$ 를 계산한다
    body: |
      $-5<t$ 이므로
      $$
      \begin{aligned}
      g(-5)&=-f(-5)\\
      &=-\frac{3}{14}\times35\times\left(-\frac{26}{3}\right)\\
      &=65
      \end{aligned}
      $$
    why: |
      $x<t$ 에서는 $g=-f$ 를 쓴다. $f(-5)=\dfrac{3}{14}\times(-5)\times(-7)\times\left(-5-\dfrac{11}{3}\right)$ 에서 $(-5)\times(-7)=35$, $-5-\dfrac{11}{3}=-\dfrac{26}{3}$ 이다.
pitfalls:
  - |
    $m=2$ 에서 분모가 0이 되니 극한이 없다고 생각해 2를 빼는 실수. $g(2)=0$ 이라 극한은 존재하고, 그 부호는 우미분계수가 정한다.
  - |
    (나)의 원소가 자연수라는 사실에서 $g(1)<0$, $g(-1)>0$ 을 끌어내지 않으면 경우가 지나치게 많아진다.
  - |
    $g(-5)$ 에서 $x<t$ 인데 $f(-5)$ 를 그대로 쓰는 실수. 그러면 $-65$ 가 된다.
