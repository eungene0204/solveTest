paperCrop: [0.513, 0.128, 0.902, 0.772]   # 원문 대조용 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    세 상수 $a\,(a>0)$, $b\,(b>1)$, $c$ 에 대하여 닫힌구간 $[0,\,2b]$ 에서 정의된 두 함수

    $$
    \begin{aligned}
    f(x)&=a\sin\frac{\pi x}{b},\\
    g(x)&=x^2-2(b+1)x+c
    \end{aligned}
    $$

    가 있다. 두 곡선 $y=f(x)$ 와 $y=g(x)$ 의 서로 다른 두 교점 $\mathrm{A}(x_1,\,y_1)$, $\mathrm{B}(x_2,\,y_2)\ (x_1<b<x_2)$ 가 존재하고, $y_2(x_1-b)=y_1(x_2-b)$ 가 성립한다고 하자.

    다음은 직선 OA와 직선 OB의 기울기의 합이 $\dfrac{100}{11}$ 일 때, $a$ 를 $b$ 에 대한 식으로 나타내는 과정이다. (단, O는 원점이다.)
  conditions:
    - |
      두 점 A, B를 지나는 직선을 $l$ 이라 하자.

      주어진 조건으로부터 $\dfrac{y_1}{x_1-b}=\dfrac{y_2}{x_2-b}$ 이므로 직선 $l$ 이 점 $(b,\,0)$ 을 지난다.

      함수 $y=f(x)$ 의 그래프의 성질로부터 선분 AB의 중점의 좌표가 $(b,\,0)$ 이므로 $x_1+x_2=2b$, $y_1+y_2=0$ 이다.

      또한 두 점 A, B는 함수 $y=g(x)$ 의 그래프와 직선 $l$ 이 만나는 점이므로 직선 $l$ 의 기울기는

      $$
      \frac{\begin{aligned}&\{x_2^{\,2}-2(b+1)x_2+c\}\\&-\{x_1^{\,2}-2(b+1)x_1+c\}\end{aligned}}{x_2-x_1}=\boxed{\text{(가)}}
      $$

      이고, 직선 $l$ 의 방정식은

      $$
      y=\boxed{\text{(가)}}\times(x-b)\qquad\cdots\cdots\ \text{㉠}
      $$

      이다. $\dfrac{y_1}{x_1}-\dfrac{y_1}{2b-x_1}=\dfrac{100}{11}$ 이므로 ㉠을 이용하여 정리하면

      $$
      36x_1^{\,2}-72bx_1+11b^2=0\quad(x_1<b)
      $$

      이고, 점 A의 $x$ 좌표는 $\boxed{\text{(나)}}\times b$ 이다.

      점 A는 곡선 $y=f(x)$ 와 직선 $l$ 의 교점이므로 $a$ 를 $b$ 에 대한 식으로 나타내면

      $$
      a=\boxed{\text{(다)}}
      $$

      이다.
  after: |
    위의 (가), (나)에 알맞은 수를 각각 $p$, $q$ 라 하고, (다)에 알맞은 식을 $h(b)$ 라 하자. $6\times\big(p+q+h(9)\big)$ 의 값을 구하시오. [4점]
