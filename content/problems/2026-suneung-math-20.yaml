paperCrop: [0.513, 0.128, 0.902, 0.652]   # 원문 대조용 영역 (쪽 대비 비율 x0, y0, x1, y1)
problem:
  body: |
    수열 $\{a_n\}$ 이 다음 조건을 만족시킨다.
  conditions:
    - |
      • $a_1=7$
    - |
      • 2 이상의 자연수 $n$ 에 대하여

      $$
      \sum_{k=1}^{n}a_k=\frac{2}{3}a_n+\frac{1}{6}n^2-\frac{1}{6}n+10
      $$

      이다.
  middle: |
    다음은 $\displaystyle\sum_{k=1}^{12}a_k+\sum_{k=1}^{5}a_{2k+1}$ 의 값을 구하는 과정이다.
  conditions2:
    - |
      2 이상의 자연수 $n$ 에 대하여 $a_{n+1}=\displaystyle\sum_{k=1}^{n+1}a_k-\sum_{k=1}^{n}a_k$ 이므로

      $$
      a_{n+1}=\frac{2}{3}(a_{n+1}-a_n)+\boxed{\text{(가)}}
      $$

      이고, 이 식을 정리하면

      $$
      2a_n+a_{n+1}=3\times\boxed{\text{(가)}}\quad\cdots\cdots\ \text{㉠}
      $$

      이다.

      $$
      \begin{aligned}
      &\sum_{k=1}^{n}a_k=\frac{2}{3}a_n+\frac{1}{6}n^2-\frac{1}{6}n+10\\
      &(n\ge2)
      \end{aligned}
      $$

      에서 양변에 $n=2$ 를 대입하면

      $$
      a_2=\boxed{\text{(나)}}\qquad\cdots\cdots\ \text{㉡}
      $$

      이다. ㉠과 ㉡에 의하여

      $$
      \begin{aligned}
      &\sum_{k=1}^{12}a_k+\sum_{k=1}^{5}a_{2k+1}\\
      &=a_1+a_2+\sum_{k=1}^{5}(2a_{2k+1}+a_{2k+2})\\
      &=\boxed{\text{(다)}}
      \end{aligned}
      $$

      이다.
  after: |
    위의 (가)에 알맞은 식을 $f(n)$ 이라 하고, (나), (다)에 알맞은 수를 각각 $p,\,q$ 라 할 때, $\dfrac{p\times q}{f(12)}$ 의 값을 구하시오. [4점]
format: short
answer:
