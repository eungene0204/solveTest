status: published
difficulty: standard
concepts:
  - { label: 수열의 합과 일반항의 관계, course2015: 수학Ⅰ, course2022: 대수 }
  - { label: 합의 기호 Σ, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  (가)는 $n+1$ 까지의 합에서 $n$ 까지의 합을 뺀 식의 나머지 부분이다. $n^2$ 항끼리, $n$ 항끼리 빼 보자.
firstIdea: |
  빈칸은 바로 앞의 식만 계산하면 채워진다. (가)는 합의 식을 $n+1$ 과 $n$ 에서 빼서 남는 $n$ 의 식, (나)는 $n=2$ 대입, (다)는 ㉠을 홀수 번째 $n=2k+1$ 에 적용해 합을 숫자로 바꾸는 것이다.
steps:
  - title: (가) 두 합의 차를 계산한다
    body: |
      $$
      \begin{aligned}
      a_{n+1}&=\frac{2}{3}(a_{n+1}-a_n)\\
      &\quad+\frac{(n+1)^2-n^2}{6}-\frac{1}{6}\\
      &=\frac{2}{3}(a_{n+1}-a_n)+\frac{n}{3}
      \end{aligned}
      $$
      따라서 (가)는 $\dfrac{n}{3}$, $f(n)=\dfrac{n}{3}$.
    why: |
      상수 10은 빼면서 사라지고, $\dfrac{1}{6}\{(n+1)^2-n^2\}=\dfrac{2n+1}{6}$ 에서 $\dfrac{1}{6}$ 을 빼면 $\dfrac{n}{3}$ 이다. 정리하면 ㉠은 $2a_n+a_{n+1}=n$ 이 된다.
  - title: (나) $n=2$ 를 대입한다
    body: |
      $$
      a_1+a_2=\frac{2}{3}a_2+\frac{4}{6}-\frac{2}{6}+10
      $$
      $a_1=7$ 이므로 $\dfrac{1}{3}a_2=\dfrac{31}{3}-7=\dfrac{10}{3}$, $a_2=10$. 따라서 $p=10$.
    why: |
      주어진 식은 $n\ge2$ 에서만 성립하므로 $a_2$ 는 $n=2$ 를 넣어 직접 구한다.
  - title: (다) ㉠을 $n=2k+1$ 에 적용한다
    body: |
      ㉠에서 $2a_{2k+1}+a_{2k+2}=2k+1$ 이므로
      $$
      \begin{aligned}
      &\sum_{k=1}^{5}(2a_{2k+1}+a_{2k+2})\\
      &=3+5+7+9+11=35
      \end{aligned}
      $$
      따라서 (다)는 $7+10+35=52$, $q=52$.
    why: |
      $\displaystyle\sum_{k=1}^{12}a_k$ 의 $a_3$ 부터 $a_{12}$ 까지와 $\displaystyle\sum_{k=1}^{5}a_{2k+1}$ 을 합치면 홀수 번째 항이 두 번씩 들어가 $2a_{2k+1}+a_{2k+2}$ 꼴이 된다. $n=2k+1\ge3$ 이라 ㉠을 쓸 수 있다.
  - title: 값을 계산한다
    body: |
      $$
      \frac{p\times q}{f(12)}=\frac{10\times52}{4}=130
      $$
    why: |
      $f(12)=\dfrac{12}{3}=4$ 다.
pitfalls:
  - |
    (가)에서 $\dfrac{1}{6}\{(n+1)^2-n^2\}$ 만 계산하고 $-\dfrac{1}{6}\{(n+1)-n\}$ 을 빠뜨려 $\dfrac{2n+1}{6}$ 으로 쓰는 실수.
  - |
    (나)에서 $a_1=7$ 을 좌변에 넣는 것을 잊고 $\displaystyle\sum_{k=1}^{2}a_k$ 를 $a_2$ 로 쓰는 실수.
  - |
    ㉠을 $n=1$ 에도 쓰는 실수. 주어진 식이 $n\ge2$ 에서만 성립하므로 ㉠도 $n\ge2$ 에서만 쓸 수 있다. 그래서 $a_1, a_2$ 는 따로 더한다.
