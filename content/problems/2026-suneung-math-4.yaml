problem:
  body: |
    함수

    $$
    f(x)=\begin{cases}3x-2 & (x<1)\\ x^2-3x+a & (x\ge1)\end{cases}
    $$

    이 실수 전체의 집합에서 연속일 때, 상수 $a$ 의 값은? [3점]
  choices: ["1", "2", "3", "4", "5"]
format: choice
answer:
  value: "3"
  choice: 3
status: published
difficulty: basic
concepts:
  - { label: 함수의 연속, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  두 식은 각자 구간 안에서는 연속이다. 문제가 생길 수 있는 곳은 식이 바뀌는 $x=1$ 하나뿐이다.
firstIdea: |
  다항식으로 정의된 각 부분은 그 구간에서 연속이므로, 실수 전체에서 연속이려면 식이 바뀌는 $x=1$ 에서만 확인하면 된다. 그 점에서 좌극한, 우극한, 함숫값이 같아야 한다.
steps:
  - title: $x=1$ 에서의 좌극한과 함숫값
    body: |
      $\displaystyle\lim_{x\to1-}f(x)=3-2=1$, $f(1)=\displaystyle\lim_{x\to1+}f(x)=1-3+a=a-2$.
    why: |
      $x<1$ 에서는 $3x-2$, $x\ge1$ 에서는 $x^2-3x+a$ 를 쓴다. $x=1$ 의 함숫값은 등호가 붙은 아래 식으로 계산한다.
  - title: 같다고 놓는다
    body: |
      $a-2=1$ 이므로 $a=3$.
    why: |
      연속의 조건은 극한값과 함숫값이 같은 것이다.
pitfalls:
  - |
    $x=1$ 의 함숫값을 위 식 $3x-2$ 로 계산하는 실수. 등호 $x\ge1$ 은 아래 식에 붙어 있다. 이 문제에서는 두 극한을 같게 놓으면 답은 같지만, 습관으로 굳히면 다른 문제에서 틀린다.
