problem:
  body: |
    양수 $a$ 에 대하여 함수 $f(x)$ 를

    $$
    f(x)=x^3+3ax^2-9a^2x+4
    $$

    라 하자. 직선 $y=5$ 가 곡선 $y=f(x)$ 에 접할 때, $f(2)$ 의 값은? [4점]
  choices: ["11", "12", "13", "14", "15"]
format: choice
answer:
  value: "14"
  choice: 4
status: published
difficulty: standard
concepts:
  - { label: 함수의 극대·극소, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 접선의 기울기, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  가로선 $y=5$ 가 곡선에 접하는 점에서 곡선의 기울기는 얼마일까?
firstIdea: |
  직선 $y=5$ 는 기울기가 0이므로, 접점은 $f'(x)=0$ 인 점, 즉 극대점이나 극소점이다. 그래서 $f'(x)=0$ 의 두 근에서의 함숫값 중 5가 될 수 있는 것을 찾는다.
steps:
  - title: 접점의 후보를 찾는다
    body: |
      $$
      \begin{aligned}
      f'(x)&=3x^2+6ax-9a^2\\
      &=3(x+3a)(x-a)
      \end{aligned}
      $$
      이므로 접점의 $x$ 좌표는 $-3a$ 또는 $a$.
    why: |
      기울기가 0인 직선에 접하려면 접점에서 $f'(x)=0$ 이어야 한다.
  - title: 함숫값이 5가 되는 쪽을 고른다
    body: |
      $f(a)=a^3+3a^3-9a^3+4=4-5a^3<4$ 이므로 5가 될 수 없다.

      $f(-3a)=-27a^3+27a^3+27a^3+4=27a^3+4=5$ 에서 $a^3=\dfrac{1}{27}$, $a=\dfrac{1}{3}$.
    why: |
      $a>0$ 이라 $f(a)$ 는 4보다 작다. 극댓값 $f(-3a)$ 쪽만 가능하다.
  - title: $f(2)$ 를 계산한다
    body: |
      $f(x)=x^3+x^2-x+4$ 이므로 $f(2)=8+4-2+4=14$.
    why: |
      $3a=1$, $9a^2=1$ 을 넣어 식을 먼저 정리하면 계산이 깔끔하다.
pitfalls:
  - |
    $f(a)=5$ 와 $f(-3a)=5$ 중 하나만 확인하고 넘어가는 실수. $f(a)=5$ 는 $a^3<0$ 이 되어 $a>0$ 에 어긋난다는 것까지 확인한다.
  - |
    $f(-3a)$ 를 계산할 때 $-9a^2\times(-3a)=+27a^3$ 의 부호 실수가 잦다.
