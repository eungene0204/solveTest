problem:
  body: |
    함수 $f(x)=x^3-5x^2+4x$ 에 대하여 함수 $g(x)$ 를

    $$
    g(x)=(2x-6)\times\lim_{t\to x+}\frac{f(t)}{|f(t)|}
    $$

    라 하자. 실수 전체의 집합에서 정의된 함수 $g(x^2)$ 이 $x=a$ 에서 불연속인 모든 $a$ 의 값을 작은 수부터 크기순으로 나열한 것을 $a_1,\,a_2,\,\cdots,\,a_n$ ($n$ 은 자연수)라 할 때, $n+g(a_3)$ 의 값은? [4점]
  choices: ["4", "6", "8", "10", "12"]
format: choice
answer:
  value: "8"
  choice: 3
status: draft
difficulty: hard
concepts:
  - { label: 함수의 연속, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 우극한, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 합성함수의 연속성, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  $\dfrac{f(t)}{|f(t)|}$ 는 $f(t)$ 의 부호만 남긴다. 그렇다면 $t\to x+$ 의 극한은 무엇을 뜻할까? $f(x)$ 의 부호표를 먼저 그려 보자.
firstIdea: |
  $\dfrac{f(t)}{|f(t)|}$ 는 $f(t)>0$ 이면 $1$, $f(t)<0$ 이면 $-1$ 이다. 따라서 극한값은 "**$x$ 의 바로 오른쪽에서 $f$ 의 부호**"이고, $f(x)=x(x-1)(x-4)$ 의 부호표만 있으면 $g$ 를 구간별 식으로 쓸 수 있다.
steps:
  - title: 오른쪽 부호로 $g(x)$ 를 구간별로 쓴다
    body: |
      $f(x)=x(x-1)(x-4)$ 는 $x<0$ 에서 음, $0<x<1$ 에서 양, $1<x<4$ 에서 음, $x>4$ 에서 양이다. 바로 오른쪽의 부호를 $s(x)$ 라 하면
      $$
      g(x)=(2x-6)\,s(x)
      $$
      $$
      s(x)=\begin{cases}-1 & x<0\\ \ \ 1 & 0\le x<1\\ -1 & 1\le x<4\\ \ \ 1 & x\ge4\end{cases}
      $$
    why: |
      $x$ 가 근일 때도 극한은 오른쪽 구간의 부호를 따르므로, 각 근에서는 오른쪽 구간의 값이 함숫값이 된다.
  - title: $g(x)$ 가 불연속인 곳
    body: |
      $s$ 가 바뀌는 $x=0,1,4$ 에서 $2x-6$ 은 각각 $-6,-4,2$ 로 0이 아니므로, $g$ 는 이 세 점에서 모두 불연속이다.
    why: |
      부호가 뒤집혀도 곱하는 값 $2x-6$ 이 0이면 연속이 될 수 있다($x=3$ 이었다면). 여기서는 그런 점이 없다.
  - title: $g(x^2)$ 로 옮긴다
    body: |
      $u=x^2\ (\ge0)$ 이 $g$ 의 불연속점 $0,1,4$ 를 지날 때를 본다.
      - $u=0$ ($x=0$): $x$ 가 0 근처면 양쪽 모두 $0\le x^2<1$ 이라 $s=1$ 로 같다. **연속**.
      - $u=1$ ($x=\pm1$): $x^2$ 이 1보다 작은 쪽과 큰 쪽에서 $g$ 값이 $-4$ 와 $4$ 로 다르다. **불연속**.
      - $u=4$ ($x=\pm2$): 마찬가지로 **불연속**.

      따라서 $a_1=-2,\ a_2=-1,\ a_3=1,\ a_4=2$, $n=4$.
    why: |
      $x=0$ 근처에서 $x^2$ 은 0의 오른쪽에만 머물기 때문에, $g$ 의 0에서의 끊김(왼쪽 값과 오른쪽 값의 차이)을 $g(x^2)$ 은 겪지 않는다.
  - title: 값을 계산한다
    body: |
      $g(a_3)=g(1)=(2-6)\cdot s(1)=(-4)(-1)=4$ 이므로 $n+g(a_3)=4+4=8$.
    why: |
      $s(1)$ 은 1의 오른쪽 구간 $(1,4)$ 의 부호 $-1$ 이다.
pitfalls:
  - |
    $g(x)$ 의 불연속점 3개를 그대로 세어 $n=3$ 으로 두는 실수. $x^2$ 이 0의 왼쪽을 지나지 않으므로 $x=0$ 은 빠지고, 1과 4는 각각 $\pm$ 두 점이 된다.
  - |
    $g(a_3)$ 에서 $s(1)=1$ 로 쓰는 실수. 극한이 $t\to x+$ 이므로 1의 오른쪽 부호를 쓴다.
  - |
    $g(a_3)$ 을 $g(a_3^2)$ 과 혼동하지 않는다. 묻는 것은 $g$ 의 값이다(여기서는 $a_3=1$ 이라 같다).
