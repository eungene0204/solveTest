problem:
  body: |
    함수 $f(x)=x^2-4x-3$ 에 대하여 곡선 $y=f(x)$ 위의 점 $(1,\,-6)$ 에서의 접선을 $l$ 이라 하고, 함수 $g(x)=(x^3-2x)f(x)$ 에 대하여 곡선 $y=g(x)$ 위의 점 $(1,\,6)$ 에서의 접선을 $m$ 이라 하자. 두 직선 $l,\,m$ 과 $y$ 축으로 둘러싸인 도형의 넓이는? [4점]
  choices: ["21", "28", "35", "42", "49"]
format: choice
answer:
  value: "49"
  choice: 5
status: published
difficulty: standard
concepts:
  - { label: 접선의 방정식, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
  - { label: 곱의 미분법, course2015: 수학Ⅱ, course2022: 미적분Ⅰ }
hint: |
  두 접선의 방정식을 각각 구하면, 둘러싸인 도형은 $y$ 축 위에 밑변이 있는 삼각형이다.
firstIdea: |
  두 직선과 $y$ 축으로 둘러싸인 도형은 삼각형이다. 밑변은 두 직선의 $y$ 절편 사이(y축 위), 높이는 두 직선의 교점의 $x$ 좌표다. 그래서 두 접선의 식을 구하는 것이 전부다. $g'(1)$ 에는 곱의 미분법을 쓴다.
steps:
  - title: 접선 $l$
    body: |
      $f'(x)=2x-4$ 이므로 $f'(1)=-2$. $l:\ y=-2(x-1)-6=-2x-4$.
    why: |
      접선의 기울기는 접점에서의 미분계수다.
  - title: 접선 $m$
    body: |
      $g'(x)=(3x^2-2)f(x)+(x^3-2x)f'(x)$ 이므로
      $$
      \begin{aligned}
      g'(1)&=1\times(-6)+(-1)\times(-2)\\
      &=-4
      \end{aligned}
      $$
      $m:\ y=-4(x-1)+6=-4x+10$.
    why: |
      $g$ 를 전개하지 않고 곱의 미분법을 쓰면 이미 아는 $f(1)=-6$, $f'(1)=-2$ 를 그대로 쓸 수 있다.
  - title: 삼각형의 넓이
    body: |
      두 직선의 $y$ 절편은 $-4$ 와 $10$ 이므로 밑변은 $14$. 교점은 $-2x-4=-4x+10$ 에서 $x=7$ 이므로 높이는 $7$.
      $$
      \frac{1}{2}\times14\times7=49
      $$
    why: |
      밑변이 $y$ 축 위에 있으므로 높이는 교점에서 $y$ 축까지의 거리, 즉 교점의 $x$ 좌표다.
pitfalls:
  - |
    $g'(1)$ 을 $(x^3-2x)'\times f'(x)$ 로 계산하는 실수. 곱의 미분은 $u'v+uv'$ 이다.
  - |
    높이를 교점의 $y$ 좌표 $-18$ 로 잡는 실수. 밑변이 $y$ 축 위에 있으므로 높이는 $x$ 좌표다.
