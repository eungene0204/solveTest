problem:
  body: |
    $\sin\theta+3\cos\theta=0$ 이고 $\cos(\pi-\theta)>0$ 일 때, $\sin\theta$ 의 값은? [3점]
  choices: ['$\dfrac{3\sqrt{10}}{10}$', '$\dfrac{\sqrt{10}}{5}$', "0", '$-\dfrac{\sqrt{10}}{5}$', '$-\dfrac{3\sqrt{10}}{10}$']
format: choice
answer:
  value: '\frac{3\sqrt{10}}{10}'
  choice: 1
  choiceOtherPaper: 5   # 짝수형 ⑤
status: published
difficulty: basic
concepts:
  - { label: 삼각함수 사이의 관계, course2015: 수학Ⅰ, course2022: 대수 }
  - { label: 삼각함수의 성질, course2015: 수학Ⅰ, course2022: 대수 }
hint: |
  $\cos(\pi-\theta)$ 를 $\cos\theta$ 로 바꿔 보자. 그러면 $\cos\theta$ 의 부호를 알 수 있다.
firstIdea: |
  $\sin\theta=-3\cos\theta$ 와 $\sin^2\theta+\cos^2\theta=1$ 을 함께 쓰면 크기는 나오지만 부호가 두 가지다. 부호를 정하는 것이 $\cos(\pi-\theta)=-\cos\theta>0$ 조건이다.
steps:
  - title: 부호를 정한다
    body: |
      $\cos(\pi-\theta)=-\cos\theta>0$ 이므로 $\cos\theta<0$. 따라서 $\sin\theta=-3\cos\theta>0$.
    why: |
      $\pi-\theta$ 의 코사인은 $\theta$ 의 코사인과 부호만 다르다.
  - title: 크기를 구한다
    body: |
      $\sin^2\theta+\cos^2\theta=9\cos^2\theta+\cos^2\theta=1$ 이므로 $\cos^2\theta=\dfrac{1}{10}$, $\cos\theta=-\dfrac{1}{\sqrt{10}}$.

      $\sin\theta=-3\cos\theta=\dfrac{3}{\sqrt{10}}=\dfrac{3\sqrt{10}}{10}$
    why: |
      $\sin\theta=-3\cos\theta$ 를 대입하면 $\cos\theta$ 하나의 식이 된다.
pitfalls:
  - |
    $\cos(\pi-\theta)$ 를 $\cos\theta$ 로 그대로 두어 $\cos\theta>0$ 으로 판단하는 실수. 그러면 부호가 반대인 ⑤를 고르게 된다.
  - |
    짝수형은 정답 선택지가 ⑤다. 번호가 아니라 값으로 확인한다.
